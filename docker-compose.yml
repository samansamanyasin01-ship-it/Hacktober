version: "3.9"

# ============================================================
#  CaseBoard AI — Docker Compose (single-container, no Nginx)
#  The Python backend serves BOTH the REST API and frontend
#  static files from the same port (8080).
#  Open http://localhost:8080 in your browser.
# ============================================================

services:

  caseboard:
    build:
      context: .
      dockerfile: Dockerfile          # root Dockerfile — all-in-one
    container_name: caseboard-ai
    restart: unless-stopped
    ports:
      - "8080:8080"                   # http://localhost:8080
    environment:
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
      # SQLite DB stored on the persistent volume
      CASEBOARD_DB_PATH: /app/data/caseboard.db
      # ── AI Provider (swap to any OpenAI-compatible endpoint) ──
      # DigitalOcean Gradient Serverless Inference (hackathon target)
      AI_PROVIDER:  ${AI_PROVIDER:-digitalocean}
      AI_BASE_URL:  ${AI_BASE_URL:-https://inference.do-ai.run/v1}
      AI_MODEL:     ${AI_MODEL:-llama3-8b-instruct}
      AI_API_KEY:   ${AI_API_KEY:-}          # set via .env or host env
    volumes:
      - caseboard-data:/app/data      # SQLite persisted across restarts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/case')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# -----------------------------------------------------------
#  Persistent volume for the SQLite investigation database
# -----------------------------------------------------------
volumes:
  caseboard-data:
    driver: local
